<svg width="728" height="414" viewBox="0 0 728 414" xmlns="http://www.w3.org/2000/svg">
<!--
  The backdrop tile: TOKO's own mark, repeated on a staggered grid.

  It used to be the reference build's mascot redrawn — a rounded square with two
  eyes and a tab — which is not this product's glyph at all. The mark here is the
  same T-with-two-eyes that is moulded onto the Play key, so the wallpaper and
  the hardware finally carry the same brand.

  The grid, the 728x414 canvas and the two greys are unchanged, so `background-
  size` and the drift animation in globals.css keep working untouched.
-->
